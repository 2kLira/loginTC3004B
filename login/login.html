<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login | Tech Mahindra</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">

  <div class="card">
    <h1 class="title">Tech Mahindra</h1>
    <p class="subtitle">Project Management Platform</p>

    <form id="loginForm">
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit" class="primary">Enter</button>
    </form>

  </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  window.location.href = "../dash/dash.html";
});
</script>

</body>
</html>
