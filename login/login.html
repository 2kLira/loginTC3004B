<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tech Mahindra | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- css -->
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <!--  principal -->
  <main class="wrap">

    <!--  login -->
    <section class="card">

      <!-- encabezado -->
      <header class="top">
        <p class="brand">Tech Mahindra</p>
        <h1 class="title">Project Hub</h1>
      </header>

      <form class="form">

        <!-- email -->
        <div class="row">
          <label class="label" for="mail">Email</label>
          <input class="input" id="mail" type="email" placeholder="name@techmahindra.com">
        </div>

        <!-- password -->
        <div class="row">
          <label class="label" for="pass">Password</label>
          <input class="input" id="pass" type="password">
        </div>

        <!-- opciones -->
        <div class="options">
          <label class="check">
            <input type="checkbox">
            Remember me
          </label>

          <a class="link" href="#">Forgot?</a>
        </div>

        <!-- boton -->
        <button class="btn" type="button">Sign in</button>

      </form>

    

      <!-- pie -->
      <footer class="foot">
        <span>A00838139</span>
        <a class="link" href="#">Guillermo Lira</a>
        <a class="link" href="#">ITESM</a>
      </footer>

    </section>

  </main>

</body>
</html>
